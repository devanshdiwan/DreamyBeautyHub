<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DreamyBeautyHub - Beauty, Skincare & Wellness</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              serif: ['Playfair Display', 'serif'],
            },
            colors: {
              brand: {
                50: '#fff1f2',
                100: '#ffe4e6',
                200: '#fecdd3',
                300: '#fda4af',
                400: '#fb7185',
                500: '#f43f5e', // Rose
                600: '#e11d48',
              },
              gold: {
                400: '#d4af37',
                500: '#c5a059',
                600: '#a38343',
              },
              stone: {
                  50: '#fafaf9',
                  100: '#f5f5f4',
              }
            }
          }
        }
      }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .font-serif { font-family: 'Playfair Display', serif; }
        
        /* Smooth fade in */
        .fade-in { animation: fadeIn 0.6s cubic-bezier(0.22, 1, 0.36, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Custom Scrollbar for Tags */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Mobile-First Typography responsiveness */
        .prose p { margin-bottom: 1.5rem; line-height: 1.75; color: #374151; font-size: 1rem; font-weight: 300; }
        .prose h2 { font-size: 1.5rem; font-family: 'Playfair Display', serif; font-weight: 700; margin-top: 2.5rem; margin-bottom: 1rem; color: #1c1917; letter-spacing: -0.02em; }
        .prose h3 { font-size: 1.25rem; font-family: 'Playfair Display', serif; font-weight: 600; margin-top: 2rem; margin-bottom: 0.75rem; color: #44403c; }
        .prose ul { list-style-type: disc; padding-left: 1.25rem; margin-bottom: 1.5rem; color: #4b5563; }
        .prose strong { color: #be185d; font-weight: 600; }
        .prose img { border-radius: 0.5rem; margin-top: 2rem; margin-bottom: 2rem; width: 100%; height: auto; display: block; }
        .prose blockquote { border-left: 3px solid #f43f5e; padding-left: 1.25rem; font-style: italic; color: #57534e; margin: 1.5rem 0; font-family: 'Playfair Display', serif; font-size: 1.125rem; }
        .prose a { color: #f43f5e; text-decoration: underline; text-underline-offset: 4px; transition: color 0.2s; }
        .prose a:hover { color: #e11d48; }
        
        @media (min-width: 640px) {
            .prose p { font-size: 1.125rem; line-height: 1.9; margin-bottom: 1.75rem; }
            .prose h2 { font-size: 1.75rem; margin-top: 3rem; margin-bottom: 1.5rem; }
            .prose h3 { font-size: 1.4rem; }
            .prose blockquote { border-left-width: 4px; padding-left: 1.5rem; font-size: 1.25rem; margin: 2rem 0; }
        }

        /* First letter dropcap */
        .dropcap::first-letter {
            float: left;
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            line-height: 0.85;
            padding-right: 0.5rem;
            padding-top: 0.25rem;
            color: #f43f5e;
            font-weight: 700;
        }
        @media (min-width: 640px) {
            .dropcap::first-letter { font-size: 3.5rem; padding-right: 0.75rem; }
        }

        /* Gradient Mask for scrolling tags */
        .mask-gradient-right {
            mask-image: linear-gradient(to right, black 85%, transparent 100%);
            -webkit-mask-image: linear-gradient(to right, black 85%, transparent 100%);
        }
    </style>
</head>
<body class="bg-stone-50 min-h-screen flex flex-col selection:bg-rose-200 selection:text-rose-900 overflow-x-hidden text-gray-800">

    <!-- Navbar -->
    <nav class="bg-white/90 backdrop-blur-lg border-b border-stone-100 sticky top-0 z-50 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16 sm:h-20">
                <div class="flex items-center min-w-0 flex-1 mr-4">
                    <a href="#" onclick="window.router.goHome(); return false;" class="flex items-center gap-2 sm:gap-3 group truncate" id="brand-link">
                        <!-- Logo Fallback -->
                        <div class="bg-gradient-to-tr from-rose-100 to-rose-50 text-rose-600 p-1.5 sm:p-2 rounded-full border border-rose-100 group-hover:scale-105 transition duration-300 shrink-0 shadow-sm">
                            <i data-lucide="sparkles" class="w-4 h-4 sm:w-5 sm:h-5"></i>
                        </div>
                        <span class="font-serif font-bold text-lg sm:text-2xl tracking-tight text-gray-900 truncate">DREAMY<span class="text-rose-500">BEAUTY</span>HUB</span>
                    </a>
                </div>
                <div class="flex items-center space-x-4 sm:space-x-6 shrink-0">
                    <div class="hidden sm:flex space-x-6">
                        <a href="#" onclick="window.router.goHome(); return false;" class="text-gray-500 hover:text-rose-600 transition font-medium text-sm tracking-wide">Journal</a>
                        <a href="#newsletter" class="text-gray-500 hover:text-rose-600 transition font-medium text-sm tracking-wide">Subscribe</a>
                    </div>
                    <button class="sm:hidden text-gray-500 hover:text-rose-600 p-2" onclick="window.scrollTo({top: document.body.scrollHeight, behavior: 'smooth'})">
                        <i data-lucide="mail" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <main id="app-root" class="flex-grow fade-in w-full">
        <!-- Loading State -->
        <div class="flex justify-center items-center h-[80vh]">
            <div class="flex flex-col items-center gap-4">
                <div class="animate-spin rounded-full h-10 w-10 sm:h-12 sm:w-12 border-2 border-stone-200 border-t-rose-500"></div>
                <span class="font-serif italic text-gray-400 text-sm sm:text-base">Loading beauty...</span>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-stone-100 pt-12 pb-8 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <div class="flex justify-center items-center gap-2 mb-4 sm:mb-6">
                <i data-lucide="flower-2" class="text-rose-300 w-6 h-6"></i>
            </div>
            <h2 class="font-serif text-xl sm:text-2xl font-bold text-gray-900 mb-4 tracking-tight" id="footer-brand">DreamyBeautyHub</h2>
            
            <div class="flex flex-wrap justify-center gap-4 sm:gap-6 mb-8 text-sm text-gray-500">
                <a href="#about" class="hover:text-rose-500 transition">About</a>
                <a href="#contact" class="hover:text-rose-500 transition">Contact</a>
                <a href="#privacy" class="hover:text-rose-500 transition">Privacy Policy</a>
            </div>

            <p class="text-gray-400 text-[10px] sm:text-xs tracking-wide">© <span id="year"></span>. All rights reserved. Glow with grace.</p>
        </div>
    </footer>

    <!-- Firebase Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCQL0cNijjLZnRSOoC3RZLnGmIo3VjlH_A",
            authDomain: "primesnapsxplayer.firebaseapp.com",
            databaseURL: "https://primesnapsxplayer-default-rtdb.firebaseio.com",
            projectId: "primesnapsxplayer",
            storageBucket: "primesnapsxplayer.firebasestorage.app",
            messagingSenderId: "703281925000",
            appId: "1:703281925000:web:f24c146929703da281c83d",
            measurementId: "G-Q65Y1Y0SYE"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- Global State ---
        let allPosts = {};
        let allPages = {};
        let siteSettings = {};
        let appState = {
            filterTag: 'All',
            searchQuery: ''
        };

        // --- Router & Actions ---
        window.router = {
            goHome: () => {
                appState.filterTag = 'All';
                appState.searchQuery = '';
                window.location.hash = '';
                window.scrollTo(0, 0);
            },
            viewPost: (id) => {
                window.location.hash = id;
            }
        };

        window.actions = {
            setTag: (tag) => {
                appState.filterTag = tag;
                appState.searchQuery = ''; // Clear search when picking tag
                renderHome(allPosts);
            },
            search: (query) => {
                appState.searchQuery = query.toLowerCase();
                if(query) appState.filterTag = 'All';
                renderHome(allPosts);
            },
            subscribe: (e) => {
                e.preventDefault();
                const emailInput = e.target.querySelector('input[type="email"]');
                const btn = e.target.querySelector('button');
                const email = emailInput.value;
                
                if(email) {
                    const originalText = btn.innerText;
                    btn.innerText = 'Subscribing...';
                    btn.disabled = true;
                    
                    push(ref(db, 'subscribers'), {
                        email: email,
                        date: new Date().toISOString()
                    }).then(() => {
                        alert('Thank you for subscribing! You have been added to our exclusive list.');
                        emailInput.value = '';
                        btn.innerText = 'Subscribed';
                        setTimeout(() => { btn.innerText = originalText; btn.disabled = false; }, 2000);
                    }).catch(err => {
                        alert('Something went wrong. Please try again.');
                        btn.innerText = originalText;
                        btn.disabled = false;
                    });
                }
            }
        };

        // --- Helpers ---
        function getUniqueTags(posts) {
            const tags = new Set(['All']);
            Object.values(posts).forEach(post => {
                if(post.tags) post.tags.forEach(t => tags.add(t));
            });
            return Array.from(tags).sort();
        }

        function updateBrandUI() {
            const brandLink = document.getElementById('brand-link');
            const footerBrand = document.getElementById('footer-brand');
            
            const brandName = siteSettings.brandName || "DREAMYBEAUTYHUB";
            const brandLogo = siteSettings.brandLogo;

            // Update Footer
            if(footerBrand) footerBrand.textContent = brandName;
            document.title = `${brandName} - Modern Beauty Magazine`;

            // Update Navbar Logo
            if(brandLink) {
                if (brandLogo) {
                    brandLink.innerHTML = `
                        <img src="${brandLogo}" alt="${brandName}" class="h-8 sm:h-10 w-auto object-contain">
                    `;
                } else {
                    brandLink.innerHTML = `
                        <div class="bg-gradient-to-tr from-rose-100 to-rose-50 text-rose-600 p-1.5 sm:p-2 rounded-full border border-rose-100 group-hover:scale-105 transition duration-300 shrink-0 shadow-sm">
                            <i data-lucide="sparkles" class="w-4 h-4 sm:w-5 sm:h-5"></i>
                        </div>
                        <span class="font-serif font-bold text-lg sm:text-2xl tracking-tight text-gray-900 truncate">${brandName}</span>
                    `;
                    if(window.lucide) window.lucide.createIcons();
                }
            }
        }

        // --- Renderers ---

        function renderNewsletter() {
            return `
                <div id="newsletter" class="bg-stone-900 text-white py-12 sm:py-24 overflow-hidden relative">
                    <div class="absolute top-0 right-0 -mr-20 -mt-20 w-64 h-64 sm:w-96 sm:h-96 bg-rose-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-pulse"></div>
                    <div class="absolute bottom-0 left-0 -ml-20 -mb-20 w-48 h-48 sm:w-72 sm:h-72 bg-gold-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20"></div>
                    
                    <div class="max-w-4xl mx-auto px-4 text-center relative z-10">
                        <span class="text-rose-400 font-bold tracking-widest uppercase text-[10px] sm:text-sm mb-3 sm:mb-4 block">Join the inner circle</span>
                        <h2 class="text-2xl sm:text-5xl font-serif font-bold mb-4 sm:mb-6 leading-tight">Weekly Beauty Secrets</h2>
                        <p class="text-stone-400 mb-8 sm:mb-10 text-sm sm:text-lg max-w-xl mx-auto font-light leading-relaxed">Get exclusive skincare tips, trend reports, and wellness guides delivered straight to your inbox.</p>
                        
                        <form onsubmit="window.actions.subscribe(event)" class="flex flex-col sm:flex-row gap-3 sm:gap-4 max-w-md mx-auto">
                            <input type="email" placeholder="Your email address" class="flex-1 rounded-full bg-white/10 border border-white/20 text-white placeholder-stone-500 px-5 py-2.5 sm:px-6 sm:py-3 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500 focus:bg-white/20 transition backdrop-blur-sm" required>
                            <button type="submit" class="px-6 py-2.5 sm:px-8 sm:py-3 bg-rose-500 hover:bg-rose-600 text-white text-sm font-medium rounded-full shadow-lg shadow-rose-900/20 transition transform hover:-translate-y-0.5">Subscribe</button>
                        </form>
                    </div>
                </div>
            `;
        }

        function renderHome(posts) {
            const container = document.getElementById('app-root');
            const allPostsArray = Object.entries(posts || {}).map(([key, val]) => ({ id: key, ...val })).reverse();
            const tags = getUniqueTags(posts);

            // Filter Logic
            let displayPosts = allPostsArray;
            if (appState.searchQuery) {
                displayPosts = allPostsArray.filter(p => 
                    p.title.toLowerCase().includes(appState.searchQuery) || 
                    (p.excerpt && p.excerpt.toLowerCase().includes(appState.searchQuery))
                );
            } else if (appState.filterTag !== 'All') {
                displayPosts = allPostsArray.filter(p => p.tags && p.tags.includes(appState.filterTag));
            }

            // Determine Layout Mode
            const showHero = appState.filterTag === 'All' && !appState.searchQuery && displayPosts.length > 0;
            const heroPost = showHero ? displayPosts[0] : null;
            const gridPosts = showHero ? displayPosts.slice(1) : displayPosts;

            // Generate HTML components
            
            // 1. Controls (Search + Tags)
            const controlsHtml = `
                <div class="border-b border-stone-100 bg-white sticky top-16 sm:top-20 z-40 shadow-sm transition-all">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 sm:py-4 flex flex-col sm:flex-row gap-3 sm:gap-4 items-center justify-between">
                        <!-- Tags -->
                        <div class="w-full sm:w-auto overflow-hidden relative group">
                            <div class="flex items-center gap-2 overflow-x-auto no-scrollbar w-full sm:w-auto pb-1 sm:pb-0 mask-gradient-right pr-4">
                                ${tags.map(tag => `
                                    <button onclick="window.actions.setTag('${tag}')" 
                                        class="shrink-0 whitespace-nowrap px-4 py-2 sm:py-1.5 rounded-full text-xs font-bold uppercase tracking-wider transition-all duration-300 select-none ${appState.filterTag === tag ? 'bg-rose-500 text-white shadow-md transform scale-105' : 'bg-stone-50 text-gray-500 hover:bg-stone-100 hover:text-gray-900'}">
                                        ${tag}
                                    </button>
                                `).join('')}
                            </div>
                        </div>
                        <!-- Search -->
                        <div class="relative w-full sm:w-64">
                            <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"></i>
                            <input type="text" 
                                placeholder="Search articles..." 
                                value="${appState.searchQuery}"
                                oninput="window.actions.search(this.value)"
                                class="w-full pl-9 pr-4 py-2 bg-stone-50 border-none rounded-full text-sm focus:ring-1 focus:ring-rose-500 focus:bg-white transition placeholder-gray-400 text-gray-800 shadow-inner sm:shadow-none">
                        </div>
                    </div>
                </div>
            `;

            // 2. Hero Section
            let heroHtml = '';
            if (heroPost) {
                const dateStr = heroPost.date ? new Date(heroPost.date).toLocaleDateString(undefined, { month: 'long', day: 'numeric' }) : 'Featured';
                heroHtml = `
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-12">
                        <a href="#${heroPost.id}" class="group grid grid-cols-1 lg:grid-cols-12 gap-6 sm:gap-10 items-center">
                            <!-- Mobile: Aspect Video (16/9), Desktop: Custom -->
                            <div class="lg:col-span-7 relative overflow-hidden rounded-xl sm:rounded-2xl shadow-lg aspect-video sm:aspect-[16/9] lg:aspect-auto lg:h-[500px]">
                                <img src="${heroPost.coverImage || 'https://images.unsplash.com/photo-1596462502278-27bfdd403348?auto=format&fit=crop&q=80'}" 
                                     class="absolute inset-0 w-full h-full object-cover transform group-hover:scale-105 transition duration-700 ease-out">
                                <div class="absolute top-3 left-3 sm:top-4 sm:left-4 bg-white/95 backdrop-blur text-rose-600 px-2.5 py-1 rounded-sm text-[10px] font-bold uppercase tracking-widest shadow-sm">
                                    Latest Story
                                </div>
                            </div>
                            <div class="lg:col-span-5 flex flex-col justify-center text-center lg:text-left">
                                <div class="mb-3 sm:mb-4 flex items-center justify-center lg:justify-start gap-2 sm:gap-3 text-gold-600 text-[10px] sm:text-xs font-bold uppercase tracking-widest">
                                    <span>${dateStr}</span>
                                    <span class="w-1 h-1 bg-gold-400 rounded-full"></span>
                                    <span>${heroPost.author || 'Editor'}</span>
                                </div>
                                <h1 class="text-2xl sm:text-4xl lg:text-5xl font-serif font-bold text-gray-900 mb-4 sm:mb-6 leading-tight group-hover:text-rose-600 transition">
                                    ${heroPost.title}
                                </h1>
                                <p class="text-gray-500 text-base sm:text-lg mb-6 sm:mb-8 font-light leading-relaxed line-clamp-3 sm:line-clamp-4">
                                    ${heroPost.excerpt || 'Read the full story to discover more beauty secrets.'}
                                </p>
                                <div class="inline-flex items-center text-rose-500 font-bold uppercase text-xs tracking-widest group-hover:translate-x-2 transition border-b-2 border-transparent hover:border-rose-200 self-center lg:self-start pb-1">
                                    Read Story <i data-lucide="arrow-right" class="w-4 h-4 ml-2"></i>
                                </div>
                            </div>
                        </a>
                    </div>
                `;
            }

            // 3. Grid Section (Masonry)
            let gridHtml = '';
            if (gridPosts.length > 0) {
                gridHtml = `
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-16">
                         ${!showHero ? `<h3 class="text-xl sm:text-2xl font-serif font-bold text-gray-900 mb-6 sm:mb-8 border-b border-stone-200 pb-3 sm:pb-4">${appState.searchQuery ? `Search: "${appState.searchQuery}"` : appState.filterTag}</h3>` : ''}
                        
                        <!-- Masonry Layout using Columns -->
                        <div class="columns-1 sm:columns-2 lg:columns-3 gap-6 sm:gap-8 space-y-0">
                            ${gridPosts.map(post => {
                                const dateStr = post.date ? new Date(post.date).toLocaleDateString() : '';
                                return `
                                    <div class="break-inside-avoid mb-6 sm:mb-8">
                                        <a href="#${post.id}" class="group block h-full">
                                            <div class="aspect-[3/2] overflow-hidden rounded-lg bg-stone-100 mb-3 sm:mb-4 relative shadow-sm">
                                                <img src="${post.coverImage || 'https://images.unsplash.com/photo-1596462502278-27bfdd403348?auto=format&fit=crop&q=80'}" 
                                                    class="w-full h-full object-cover transform group-hover:scale-110 transition duration-700 ease-out">
                                                ${post.tags && post.tags[0] ? `<span class="absolute bottom-3 left-3 bg-white/95 backdrop-blur text-gray-900 text-[10px] px-2 py-1 font-bold uppercase tracking-wider">${post.tags[0]}</span>` : ''}
                                            </div>
                                            <div class="flex flex-col">
                                                <div class="flex items-center text-[10px] sm:text-xs text-gray-400 mb-2 uppercase tracking-wider font-medium">
                                                    <span>${dateStr}</span>
                                                </div>
                                                <h2 class="text-lg sm:text-xl font-serif font-bold text-gray-900 mb-2 leading-snug group-hover:text-rose-600 transition">
                                                    ${post.title}
                                                </h2>
                                                <p class="text-gray-500 text-sm leading-relaxed line-clamp-3 font-light">
                                                    ${post.excerpt || ''}
                                                </p>
                                            </div>
                                        </a>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            } else {
                gridHtml = `
                    <div class="flex flex-col items-center justify-center py-16 sm:py-24 text-center px-4">
                        <div class="w-12 h-12 sm:w-16 sm:h-16 bg-stone-100 rounded-full flex items-center justify-center mb-4 text-stone-400">
                            <i data-lucide="search-x" class="w-6 h-6 sm:w-8 sm:h-8"></i>
                        </div>
                        <h3 class="text-lg sm:text-xl font-serif font-bold text-gray-900 mb-2">No stories found</h3>
                        <p class="text-sm sm:text-base text-gray-500">Try adjusting your search or category.</p>
                        <button onclick="window.actions.setTag('All')" class="mt-6 text-rose-500 hover:text-rose-600 font-medium text-sm underline">View all stories</button>
                    </div>
                `;
            }

            container.innerHTML = `
                ${controlsHtml}
                ${heroHtml}
                ${gridHtml}
                ${renderNewsletter()}
            `;
            if(window.lucide) window.lucide.createIcons();
        }

        function renderPage(pageId) {
            const container = document.getElementById('app-root');
            window.scrollTo(0, 0);

            const content = allPages[pageId] || `<p class="text-center text-gray-500 italic">Content coming soon...</p>`;
            const titles = {
                about: 'About Us',
                contact: 'Contact Us',
                privacy: 'Privacy Policy'
            };

            container.innerHTML = `
                <div class="bg-white min-h-[60vh]">
                     <header class="max-w-3xl mx-auto px-4 sm:px-6 pt-12 sm:pt-20 pb-8 sm:pb-10 text-center border-b border-stone-50">
                        <h1 class="text-3xl sm:text-5xl font-serif font-bold text-gray-900 mb-4">${titles[pageId] || 'Page'}</h1>
                        <div class="w-20 h-1 bg-rose-500 mx-auto"></div>
                    </header>
                    <div class="max-w-3xl mx-auto px-4 sm:px-6 py-12 prose prose-rose font-serif text-gray-700 leading-loose">
                        ${content.replace(/\n/g, '<br>')}
                    </div>
                    ${renderNewsletter()}
                </div>
            `;
            if(window.lucide) window.lucide.createIcons();
        }

        function renderPost(post, postId) {
            const container = document.getElementById('app-root');
            window.scrollTo(0, 0);
            
            if (!post) {
                container.innerHTML = `<div class="p-20 text-center">Story not found. <a href="#" onclick="window.router.goHome()" class="text-rose-500 underline">Go Home</a></div>`;
                return;
            }

            document.title = `${post.title} - ${siteSettings.brandName}`;
            const dateStr = post.date ? new Date(post.date).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' }) : '';

            // Find related posts (random 3 excluding current)
            const allOtherPosts = Object.entries(allPosts).filter(([k]) => k !== postId).map(([k, v]) => ({id:k, ...v}));
            // Shuffle simple
            const related = allOtherPosts.sort(() => 0.5 - Math.random()).slice(0, 3);

            // Format content handling HTML tags from admin
            let formattedContent = (post.content || '')
                .replace(/\n/g, '<br>')
                .replace(/<br>\s*<(h2|h3|blockquote|div|p|img)/g, '<$1')
                .replace(/<\/(h2|h3|blockquote|div|p)>\s*<br>/g, '</$1>');

            container.innerHTML = `
                <div class="bg-white min-h-screen">
                    <!-- Reading Progress -->
                    <div class="fixed top-0 left-0 h-1 bg-gradient-to-r from-rose-400 to-rose-600 z-50 w-full transform origin-left scale-x-0 transition-transform duration-100 ease-out" id="readingProgress"></div>

                    <article>
                        <!-- Header -->
                        <header class="max-w-3xl mx-auto px-4 sm:px-6 pt-8 sm:pt-20 pb-6 sm:pb-8 text-center">
                            <div class="flex flex-wrap justify-center gap-2 sm:gap-3 mb-4 sm:mb-6">
                                ${(post.tags || []).map(t => `<span onclick="window.actions.setTag('${t}'); window.location.hash=''" class="cursor-pointer bg-stone-50 hover:bg-stone-100 text-gray-600 px-3 py-1 rounded-full text-[10px] font-bold tracking-widest uppercase transition">${t}</span>`).join('')}
                            </div>
                            <h1 class="text-3xl sm:text-5xl md:text-6xl font-serif font-bold text-gray-900 mb-6 sm:mb-8 leading-tight tracking-tight">${post.title}</h1>
                            <div class="flex items-center justify-center gap-3 sm:gap-4 text-sm border-t border-b border-stone-100 py-3 sm:py-4 inline-flex w-full">
                                <span class="font-bold text-gray-900 font-serif italic">By ${post.author || 'The Team'}</span>
                                <span class="text-gray-300">|</span>
                                <time class="text-gray-500 uppercase tracking-wider text-xs">${dateStr}</time>
                            </div>
                        </header>

                        <!-- Featured Image -->
                        <div class="max-w-5xl mx-auto px-0 sm:px-6 mb-8 sm:mb-16">
                            <div class="aspect-video sm:aspect-[16/9] sm:rounded-sm overflow-hidden shadow-lg bg-stone-100">
                                <img src="${post.coverImage || ''}" alt="${post.title}" class="w-full h-full object-cover">
                            </div>
                        </div>

                        <!-- Content -->
                        <div class="prose prose-rose mx-auto px-4 sm:px-6 font-serif text-gray-700 leading-loose pb-12 sm:pb-16 dropcap">
                            ${formattedContent}
                        </div>

                        <!-- Author/End Note -->
                        <div class="max-w-2xl mx-auto px-4 mb-16 sm:mb-20">
                            <div class="bg-stone-50 p-6 sm:p-8 rounded-xl text-center">
                                <i data-lucide="sparkles" class="w-5 h-5 sm:w-6 sm:h-6 text-rose-400 mx-auto mb-3"></i>
                                <p class="font-serif italic text-gray-600 text-sm sm:text-base">"Beauty is illumination of your soul."</p>
                            </div>
                        </div>
                    </article>

                    <!-- Related Stories -->
                    ${related.length > 0 ? `
                        <div class="bg-stone-50 py-12 sm:py-16 border-t border-stone-200">
                            <div class="max-w-6xl mx-auto px-4 sm:px-6">
                                <h3 class="text-xl sm:text-2xl font-serif font-bold text-gray-900 mb-8 sm:mb-10 text-center">You Might Also Like</h3>
                                <div class="grid gap-6 sm:gap-8 sm:grid-cols-3">
                                    ${related.map(p => `
                                        <a href="#${p.id}" class="group block">
                                            <div class="aspect-[4/3] bg-white rounded-lg overflow-hidden shadow-sm mb-3 sm:mb-4">
                                                <img src="${p.coverImage}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                                            </div>
                                            <h4 class="font-serif font-bold text-base sm:text-lg text-gray-900 group-hover:text-rose-600 transition leading-snug">${p.title}</h4>
                                        </a>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    ` : ''}
                    
                    ${renderNewsletter()}
                </div>
            `;
            if(window.lucide) window.lucide.createIcons();
            
            // Scroll Progress Logic
            window.onscroll = function() {
                let winScroll = document.body.scrollTop || document.documentElement.scrollTop;
                let height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
                let scrolled = (winScroll / height) * 100;
                const bar = document.getElementById("readingProgress");
                if(bar) bar.style.transform = `scaleX(${scrolled / 100})`;
            };
        }

        // --- Init ---
        function handleRouting() {
            const hash = window.location.hash.substring(1);
            
            if (hash === 'about' || hash === 'contact' || hash === 'privacy') {
                renderPage(hash);
            } else if (hash) {
                renderPost(allPosts[hash], hash);
            } else {
                renderHome(allPosts);
            }
        }

        document.getElementById('year').textContent = new Date().getFullYear();

        const postsRef = ref(db, 'posts');
        onValue(postsRef, (snapshot) => {
            allPosts = snapshot.val() || {};
            handleRouting();
        });

        const settingsRef = ref(db, 'settings');
        onValue(settingsRef, (snapshot) => {
            siteSettings = snapshot.val() || {};
            updateBrandUI();
        });
        
        const pagesRef = ref(db, 'pages');
        onValue(pagesRef, (snapshot) => {
            allPages = snapshot.val() || {};
            // If currently viewing a page, re-render it to show updates immediately
            const hash = window.location.hash.substring(1);
            if(hash === 'about' || hash === 'contact' || hash === 'privacy') {
                renderPage(hash);
            }
        });

        window.addEventListener('hashchange', handleRouting);

    </script>
</body>
</html>
