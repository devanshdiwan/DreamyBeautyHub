<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DreamyBeautyHub - Beauty, Skincare & Wellness</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              serif: ['Playfair Display', 'serif'],
            },
            colors: {
              brand: {
                50: '#fff1f2',
                100: '#ffe4e6',
                200: '#fecdd3',
                300: '#fda4af',
                400: '#fb7185',
                500: '#f43f5e', // Rose
                600: '#e11d48',
              },
              gold: {
                400: '#d4af37',
                500: '#c5a059', // Logo Gold
                600: '#a38343',
              }
            }
          }
        }
      }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-serif { font-family: 'Playfair Display', serif; }
        /* Smooth fade in */
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .prose p { margin-bottom: 1.5rem; line-height: 1.8; color: #4b5563; font-size: 1.125rem; }
        .prose h2 { font-size: 1.75rem; font-family: 'Playfair Display', serif; font-weight: 700; margin-top: 2.5rem; margin-bottom: 1.25rem; color: #111827; }
        .prose ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1.5rem; color: #4b5563; }
        .prose strong { color: #be185d; font-weight: 600; }
        .prose img { border-radius: 0.5rem; margin-top: 2rem; margin-bottom: 2rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .prose a { color: #f43f5e; text-decoration: underline; }
    </style>
</head>
<body class="bg-rose-50 min-h-screen flex flex-col selection:bg-rose-200 selection:text-rose-900">

    <!-- Navbar -->
    <nav class="bg-white/80 backdrop-blur-md border-b border-rose-100 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20">
                <div class="flex items-center">
                    <a href="#" onclick="window.location.hash=''; return false;" class="flex items-center gap-3 group" id="brand-link">
                        <!-- Default Logo -->
                        <div class="bg-rose-100 text-rose-600 p-2 rounded-full border border-rose-200 group-hover:bg-rose-200 transition">
                            <i data-lucide="sparkles" class="w-5 h-5"></i>
                        </div>
                        <span class="font-serif font-bold text-2xl tracking-wide text-gray-900">DREAMY<span class="text-rose-500">BEAUTY</span>HUB</span>
                    </a>
                </div>
                <div class="flex items-center space-x-8">
                    <a href="#" onclick="window.location.hash=''; return false;" class="text-gray-600 font-medium hover:text-rose-600 transition text-sm uppercase tracking-wider">Home</a>
                    <a href="admin.html" class="text-gray-400 font-medium hover:text-rose-600 transition flex items-center gap-1 text-sm uppercase tracking-wider">
                        <i data-lucide="lock" class="w-3 h-3"></i> Admin
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <main id="app-root" class="flex-grow fade-in">
        <!-- Content injected via JS -->
        <div class="flex justify-center items-center h-96">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-rose-400"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-rose-100 py-12 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <div class="flex justify-center items-center gap-2 mb-4">
                <i data-lucide="flower-2" class="text-rose-300"></i>
            </div>
            <p class="font-serif text-gray-900 text-lg mb-2" id="footer-brand">DreamyBeautyHub</p>
            <p class="text-gray-400 text-sm">© <span id="year"></span>. Glow with grace.</p>
        </div>
    </footer>

    <!-- Firebase Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCQL0cNijjLZnRSOoC3RZLnGmIo3VjlH_A",
            authDomain: "primesnapsxplayer.firebaseapp.com",
            databaseURL: "https://primesnapsxplayer-default-rtdb.firebaseio.com",
            projectId: "primesnapsxplayer",
            storageBucket: "primesnapsxplayer.firebasestorage.app",
            messagingSenderId: "703281925000",
            appId: "1:703281925000:web:f24c146929703da281c83d",
            measurementId: "G-Q65Y1Y0SYE"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Global state
        let allPosts = {};
        let siteSettings = {};

        // --- Render Functions ---
        function updateBrandUI() {
            const brandLink = document.getElementById('brand-link');
            const footerBrand = document.getElementById('footer-brand');
            
            const brandName = siteSettings.brandName || "DREAMYBEAUTYHUB";
            const brandLogo = siteSettings.brandLogo;

            // Update Footer
            footerBrand.textContent = brandName;
            document.title = `${brandName} - Beauty, Skincare & Wellness`;

            // Update Navbar Logo
            if (brandLogo) {
                // Image Logo
                brandLink.innerHTML = `
                    <img src="${brandLogo}" alt="${brandName}" class="h-10 w-auto object-contain">
                    <span class="sr-only">${brandName}</span>
                `;
            } else {
                // Text Logo (Default fallback)
                brandLink.innerHTML = `
                    <div class="bg-rose-100 text-rose-600 p-2 rounded-full border border-rose-200 group-hover:bg-rose-200 transition">
                        <i data-lucide="sparkles" class="w-5 h-5"></i>
                    </div>
                    <span class="font-serif font-bold text-2xl tracking-wide text-gray-900">${brandName}</span>
                `;
                if(window.lucide) window.lucide.createIcons();
            }
        }

        function getHashId() {
            return window.location.hash ? window.location.hash.substring(1) : null;
        }

        function renderHome(posts) {
            const container = document.getElementById('app-root');
            window.scrollTo(0, 0);

            const postList = Object.entries(posts || {}).map(([key, val]) => ({ id: key, ...val })).reverse();

            if (postList.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-32">
                        <div class="mx-auto w-16 h-16 bg-rose-100 rounded-full flex items-center justify-center mb-4 text-rose-500">
                            <i data-lucide="pen-tool"></i>
                        </div>
                        <h2 class="text-3xl font-serif font-bold text-gray-900 mb-2">No stories yet</h2>
                        <p class="text-gray-500">Beauty takes time. Check back soon for updates.</p>
                    </div>
                `;
                if(window.lucide) window.lucide.createIcons();
                return;
            }

            let html = `
                <!-- Hero -->
                <div class="bg-gradient-to-b from-white to-rose-50 border-b border-rose-100 py-20 sm:py-28">
                    <div class="max-w-4xl mx-auto px-4 text-center">
                        <span class="text-rose-500 font-medium tracking-widest text-sm uppercase mb-4 block">Welcome to Your Sanctuary</span>
                        <h1 class="text-5xl sm:text-7xl font-serif font-bold text-gray-900 mb-6 tracking-tight">
                            Radiate <span class="text-transparent bg-clip-text bg-gradient-to-r from-rose-400 to-gold-500">Elegance</span>
                        </h1>
                        <p class="text-xl text-gray-500 leading-relaxed font-light max-w-2xl mx-auto">
                            Discover the secrets to glowing skin, timeless beauty trends, and self-care rituals designed just for you.
                        </p>
                    </div>
                </div>

                <!-- Grid -->
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
                    <div class="grid gap-10 md:grid-cols-2 lg:grid-cols-3">
            `;

            postList.forEach(post => {
                const dateStr = post.date ? new Date(post.date).toLocaleDateString() : 'Recent';
                const tagsHtml = (post.tags || []).slice(0, 1).map(t => 
                    `<span class="inline-block bg-white/95 backdrop-blur-sm text-rose-600 text-[10px] px-3 py-1 rounded-sm font-bold uppercase tracking-widest border border-rose-100">${t}</span>`
                ).join('');
                
                html += `
                    <a href="#${post.id}" class="group bg-white rounded-t-2xl rounded-b-lg shadow-sm hover:shadow-[0_8px_30px_rgb(0,0,0,0.04)] transition-all duration-500 overflow-hidden flex flex-col h-full border border-rose-50">
                        <div class="h-64 overflow-hidden relative">
                            <img src="${post.coverImage || 'https://images.unsplash.com/photo-1596462502278-27bfdd403348?auto=format&fit=crop&q=80'}" alt="${post.title}" class="w-full h-full object-cover transform group-hover:scale-105 transition duration-700 ease-out">
                            <div class="absolute bottom-4 left-4">${tagsHtml}</div>
                            <div class="absolute inset-0 bg-gradient-to-t from-black/20 to-transparent opacity-0 group-hover:opacity-100 transition duration-300"></div>
                        </div>
                        <div class="p-8 flex-1 flex flex-col">
                            <div class="flex items-center text-xs text-gold-600 font-medium mb-4 gap-2 uppercase tracking-wider">
                                <span>${dateStr}</span>
                                <span class="w-1 h-1 bg-gold-400 rounded-full"></span>
                                <span>${post.author || 'Editor'}</span>
                            </div>
                            <h2 class="text-2xl font-serif font-bold text-gray-900 mb-3 group-hover:text-rose-600 transition leading-tight">${post.title}</h2>
                            <p class="text-gray-500 line-clamp-3 mb-6 flex-1 font-light leading-relaxed">${post.excerpt || ''}</p>
                            <div class="flex items-center text-rose-500 font-medium text-sm group/link">
                                Read Article <i data-lucide="arrow-right" class="w-4 h-4 ml-2 transform group-hover/link:translate-x-1 transition"></i>
                            </div>
                        </div>
                    </a>
                `;
            });

            html += `</div></div>`;
            container.innerHTML = html;
            if(window.lucide) window.lucide.createIcons();
        }

        function renderPost(post) {
            const container = document.getElementById('app-root');
            window.scrollTo(0, 0);
            
            if (!post) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center min-h-[60vh] text-center px-4">
                        <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mb-4 text-gray-400">
                            <i data-lucide="file-question" class="w-8 h-8"></i>
                        </div>
                        <h2 class="text-2xl font-serif font-bold text-gray-900 mb-2">Story Not Found</h2>
                        <p class="text-gray-500 mb-6">This article may have been removed or is unavailable.</p>
                        <a href="#" onclick="window.location.hash=''; return false;" class="px-6 py-2 bg-rose-500 text-white rounded-full font-medium hover:bg-rose-600 transition">Return Home</a>
                    </div>
                `;
                if(window.lucide) window.lucide.createIcons();
                return;
            }

            document.title = `${post.title} - ${siteSettings.brandName || 'DreamyBeautyHub'}`;
            const dateStr = post.date ? new Date(post.date).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' }) : 'Unknown Date';
            
            container.innerHTML = `
                <div class="bg-white min-h-screen">
                    <div class="fixed top-0 left-0 h-1 bg-rose-500 z-50 w-full transform origin-left scale-x-0" id="readingProgress"></div>

                    <article class="max-w-3xl mx-auto px-4 py-16">
                        <a href="#" onclick="window.location.hash=''; return false;" class="inline-flex items-center text-gray-400 hover:text-rose-600 mb-10 transition text-sm font-medium uppercase tracking-wider">
                            <i data-lucide="arrow-left" class="w-4 h-4 mr-2"></i> Back to Journal
                        </a>
                        
                        <header class="mb-12 text-center">
                            <div class="flex justify-center gap-3 mb-8">
                                ${(post.tags || []).map(t => `<span class="bg-rose-50 text-rose-600 px-3 py-1 rounded-full text-xs font-bold tracking-widest uppercase">${t}</span>`).join('')}
                            </div>
                            <h1 class="text-4xl md:text-6xl font-serif font-bold text-gray-900 mb-8 leading-tight">${post.title}</h1>
                            <div class="flex items-center justify-center space-x-3 text-gray-500 text-sm">
                                <span class="font-medium text-gray-900 italic">By ${post.author || 'DreamyBeauty Team'}</span>
                                <span class="text-gray-300">•</span>
                                <time class="uppercase tracking-wide">${dateStr}</time>
                            </div>
                        </header>

                        <div class="mb-16 -mx-4 sm:-mx-10 shadow-2xl rounded-sm overflow-hidden">
                            <img src="${post.coverImage || 'https://images.unsplash.com/photo-1596462502278-27bfdd403348?auto=format&fit=crop&q=80'}" alt="${post.title}" class="w-full h-auto object-cover max-h-[600px]">
                        </div>

                        <div class="prose prose-lg prose-rose mx-auto font-serif text-gray-700 leading-loose">
                            ${(post.content || '').replace(/\n/g, '<br>')}
                        </div>
                        
                        <div class="mt-20 pt-10 border-t border-rose-100 text-center">
                             <p class="font-serif italic text-gray-400 text-lg">Thanks for reading</p>
                             <div class="mt-4 flex justify-center">
                                <i data-lucide="heart" class="text-rose-300 w-6 h-6"></i>
                             </div>
                        </div>
                    </article>
                </div>
            `;
            if(window.lucide) window.lucide.createIcons();
            
            window.onscroll = function() {
                let winScroll = document.body.scrollTop || document.documentElement.scrollTop;
                let height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
                let scrolled = (winScroll / height) * 100;
                const bar = document.getElementById("readingProgress");
                if(bar) bar.style.transform = `scaleX(${scrolled / 100})`;
            };
        }

        function handleRouting() {
            const postId = getHashId();
            if (postId) {
                renderPost(allPosts[postId]);
            } else {
                renderHome(allPosts);
            }
        }

        // --- Initialization ---
        document.getElementById('year').textContent = new Date().getFullYear();

        const postsRef = ref(db, 'posts');
        onValue(postsRef, (snapshot) => {
            allPosts = snapshot.val() || {};
            handleRouting();
        });

        const settingsRef = ref(db, 'settings');
        onValue(settingsRef, (snapshot) => {
            siteSettings = snapshot.val() || {};
            updateBrandUI();
        });

        window.addEventListener('hashchange', handleRouting);

    </script>
</body>
</html>
